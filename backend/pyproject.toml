[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polydoc"
version = "1.0.0"
description = "PolyDoc — multilingual (Hindi/English/Hinglish) document-grounded RAG assistant"
# No `readme` key: it must resolve inside the package root, and the project
# README lives one level up at the repo root.
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  # --- API ---
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27",

  # --- Persistence ---
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "greenlet>=3.1",

  # --- Queue / cache ---
  "redis>=5.2",
  "celery[redis]>=5.4",

  # --- Vector store ---
  # Pinned to the same minor as the qdrant image in docker-compose.yml.
  "qdrant-client>=1.18,<1.19",

  # --- Document parsing / OCR ---
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "pytesseract>=0.3.13",
  "pillow>=11.0",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",

  # --- Multilingual NLP ---
  "lingua-language-detector>=2.0",
  "indic-transliteration>=2.3",
  "regex>=2024.9",

  # --- Generation (provider-swappable; see app/core/config.py:LLMSettings) ---
  "google-genai>=1.0",
  "anthropic>=0.69",

  # --- Observability ---
  "structlog>=24.4",
  "prometheus-fastapi-instrumentator>=7.0",
  "tenacity>=9.0",
]

[project.optional-dependencies]
# Heavy ML stack, split out so the API image and CI can stay slim.
# bge-m3 and bge-reranker-v2-m3 are driven directly through `transformers`
# (see app/retrieval/embeddings/bgem3.py). FlagEmbedding is deliberately NOT a
# dependency: its encoder and reranker both break against transformers 5.x.
ml = [
  "torch>=2.4",
  "transformers>=4.45",
  "huggingface-hub>=0.26",
]
eval = [
  "ragas>=0.2",
  "datasets>=3.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "tabulate>=0.9",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "asgi-lifespan>=2.1",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-requests",
  "faker>=30.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires Postgres/Redis/Qdrant to be running",
  "ml: requires the local embedding/reranker models",
  "slow: long-running (OCR, full-corpus eval)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE", "ASYNC"]
ignore = [
  "E501",   # line length is enforced by the formatter
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF012", # mutable class attrs are fine on SQLAlchemy/pydantic models
  "N818",   # our error classes intentionally omit the "Error" suffix rule
  # This is a multilingual text-processing project. Devanagari digits, NBSP
  # variants, en dashes, and typographic hyphens are the *subject matter* —
  # normalising them is what app/ingestion/cleaning.py is for. Flagging every
  # such literal as "ambiguous" is pure noise here.
  "RUF001", # ambiguous character in a string
  "RUF002", # ambiguous character in a docstring
  "RUF003", # ambiguous character in a comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "BLE001"]

[tool.mypy]
# Deliberately unpinned: mypy targets the running interpreter. Pinning to 3.11
# makes it re-parse 3.12+ stubs (numpy) under 3.11 grammar and hard-fail.
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

# Untyped third-party modules get overrides added as each batch starts using them.
